name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run publish-kit unit tests
        run: |
          python3 -m unittest discover -s plugins/sc-publish/.github/scripts/tests -p 'test_install.py'
          python3 -m unittest discover -s plugins/sc-publish/.github/scripts/tests -p 'test_publish_kit_*.py'
      - name: Provision the pinned renderer
        id: renderer
        shell: bash
        run: |
          renderer="$(python3 plugins/sc-publish/.github/scripts/bootstrap_sc_compose.py --root "${RUNNER_TEMP}/sc-compose")"
          echo "SC_COMPOSE_BIN=${renderer}" >> "$GITHUB_ENV"
      - name: Run generic manifest integration examples
        run: python3 .integration/manifest_examples.py
