name: Run consumer publish gate
description: >-
  Run the consumer-declared checks that opt in with `before_publish = true` in
  release/publish-preflight.toml, before a publication path publishes anything.
  A no-op when the repository declares no such check. The kit ships no check of
  its own: the consumer's command decides, using the candidate it is given.

inputs:
  release_tag:
    description: Candidate release tag (vX.Y.Z) this publication path will publish.
    required: true
  publish_path:
    description: Name of the publication path running the gate (for example crates-publish or release).
    required: true
  release_version:
    description: >-
      Bare version (for example 1.4.1) when the path computes it itself, as
      for prefixed tags such as prerelease/v1.4.1. Defaults to release_tag
      without a leading v.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run opted-in consumer publish checks
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        PUBLISH_PATH: ${{ inputs.publish_path }}
        RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
      run: |
        set -euo pipefail
        manifest="release/publish-preflight.toml"
        # No opt-in, no work: nothing is executed and no extra tool is needed.
        if [[ ! -f "${manifest}" ]] || ! grep -q 'before_publish' "${manifest}"; then
          echo "publish-gate: no check opts in with before_publish; skipping (${PUBLISH_PATH})"
          exit 0
        fi
        # Candidate bindings handed to the consumer's own commands.
        export RELEASE_TAG PUBLISH_PATH
        export RELEASE_VERSION="${RELEASE_VERSION_INPUT:-${RELEASE_TAG#v}}"
        bash .github/scripts/run-consumer-preflight.sh --publish
