# Example only: copy to release/publish-artifacts.toml in a consuming repository
# and replace every placeholder with that repository's actual release surface.

[release]
version_source = "Cargo.toml"
tag_prefix = "v"

[[artifacts.crates]]
name = "example-crate"
publish_order = 1

[[artifacts.wheels]]
package = "example-package"
python_package = "example_package"

[channels.github_release]
enabled = true

[channels.crates_io]
enabled = true

[channels.pypi]
enabled = true
workflow = "pypi-publish.yml"

[channels.homebrew]
enabled = false

[channels.scoop]
enabled = false

[channels.winget]
enabled = false
